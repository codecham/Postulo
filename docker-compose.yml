# Environment shared by every service that runs the API code (api, migrate)
x-api-environment: &api-environment
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  # "db" is the service name below: Compose's internal DNS resolves it to the db container
  POSTGRES_HOST: db
  # Port inside the Compose network (POSTGRES_PORT in .env is the port on your Mac)
  POSTGRES_PORT: 5432
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off job: applies the Alembic migrations, then exits
  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    environment: *api-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      # Start the API only once the database schema is up to date
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl, so use Python's standard library
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
