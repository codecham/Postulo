# Development-only settings, merged automatically by `docker compose up`.
# Production must not use this file: run `docker compose -f docker-compose.yml up` there.
services:
  api:
    # Auto-reload the server when the code changes
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Mount only the source code, not .venv or caches
      - ./apps/api/app:/code/app

  migrate:
    volumes:
      # New migration files are picked up without rebuilding the image
      - ./apps/api/migrations:/code/migrations
