default_install_hook_types: [pre-commit, pre-push]

repos:
  # --- Generic hooks (whole repository) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^apps/web/tsconfig.*\.json$ # tsconfig files contain comments
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # --- API: Ruff (lint + format) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  # --- Local hooks that use the project's own tools ---
  - repo: local
    hooks:
      # API: type checking with mypy, using the API's uv environment
      - id: mypy
        name: mypy (api)
        entry: uv run --directory apps/api mypy app
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      # Web: Prettier
      - id: prettier
        name: prettier (web)
        entry: bash -c 'cd apps/web && npx prettier --write --ignore-unknown "${@#apps/web/}"' --
        language: system
        files: ^apps/web/
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown]

      # Web: ESLint
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd apps/web && npx eslint --fix --max-warnings=0 "${@#apps/web/}"' --
        language: system
        files: ^apps/web/.*\.(js|jsx|ts|tsx|mjs)$

      # Web: TypeScript check (slow, so it runs on push)
      - id: tsc
        name: tsc (web)
        entry: bash -c 'cd apps/web && npx tsc --noEmit'
        language: system
        files: ^apps/web/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]
