name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Throwaway values for the CI database and token signing (never used outside CI)
env:
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci-password
  POSTGRES_DB: ci
  JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters-long

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  web:
    name: Web (lint, types, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: npm ci --no-audit --no-fund
      - name: Check that the API client types are up to date
        run: |
          (cd ../api && uv run --locked python -m scripts.export_openapi ../web/openapi.json)
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::The API changed: run 'make api-types' and commit src/lib/api/schema.d.ts"
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  docker:
    name: Production stack (build, start, smoke test)
    runs-on: ubuntu-latest
    env:
      PROD_COMPOSE: docker compose -f compose.prod.yaml --env-file .env.prod
    steps:
      - uses: actions/checkout@v7
      # DOMAIN=localhost: Caddy serves HTTPS with a certificate from its local authority
      - run: scripts/generate-env.sh .env.prod.example .env.prod
      - run: $PROD_COMPOSE up --detach --build --wait
      - name: Smoke test through the reverse proxy
        run: |
          headers=$(curl --fail --silent --insecure --dump-header - --output /dev/null https://localhost/)
          echo "$headers"
          grep -qi '^strict-transport-security:' <<< "$headers"
          grep -qi '^content-security-policy:' <<< "$headers"
          # HTTP redirects to HTTPS
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = 308
      - name: Check that the API is private and hides its docs
        run: |
          if curl --silent --max-time 3 http://localhost:8000/health; then
            echo "::error::The API port must not be published in production"
            exit 1
          fi
          $PROD_COMPOSE exec -T web node -e "fetch('http://api:8000/docs').then((r) => process.exit(r.status === 404 ? 0 : 1))"
      - if: failure()
        run: $PROD_COMPOSE logs
      - if: always()
        run: $PROD_COMPOSE down --volumes
